<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Moonlit Manor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Philosopher:wght@400;700&family=Nunito:wght@500;700;800&display=swap">
<link rel="stylesheet" href="css/style.css">

<!-- Icon sprite -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gGem" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8f6ff"/><stop offset=".5" stop-color="#9fd0ff"/><stop offset="1" stop-color="#b48cff"/></linearGradient>
    <radialGradient id="gCoin" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff2b8"/><stop offset=".6" stop-color="#ffc84a"/><stop offset="1" stop-color="#c98a1c"/></radialGradient>
    <linearGradient id="gHeart" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb0dc"/><stop offset="1" stop-color="#ff4f9e"/></linearGradient>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11 12 3l9 8v10h-6v-6H9v6H3z" fill="currentColor"/></symbol>
    <symbol id="i-map" viewBox="0 0 24 24"><path d="M9 3 3 5v16l6-2 6 2 6-2V3l-6 2zm0 2.2 6 2v13.6l-6-2z" fill="currentColor"/></symbol>
    <symbol id="i-quest" viewBox="0 0 24 24"><path d="M12 1l2.6 7.4L22 11l-7.4 2.6L12 21l-2.6-7.4L2 11l7.4-2.6z" fill="currentColor"/></symbol>
    <symbol id="i-bag" viewBox="0 0 24 24"><path d="M8 7V6a4 4 0 0 1 8 0v1h3l1 14H4L5 7zm2 0h4V6a2 2 0 0 0-4 0z" fill="currentColor"/></symbol>
    <symbol id="i-hanger" viewBox="0 0 24 24"><path d="M12 4a2.5 2.5 0 0 0-2.5 2.5h2A.5.5 0 1 1 12 7a1 1 0 0 0-1 1v1.4L2.6 15A1.5 1.5 0 0 0 3.4 18h17.2a1.5 1.5 0 0 0 .8-3L13 9.4v-.6A2.5 2.5 0 0 0 12 4zm0 7 7.6 5H4.4z" fill="currentColor"/></symbol>
    <symbol id="i-shop" viewBox="0 0 24 24"><path d="M6 8h12l1 13H5zm3 0V7a3 3 0 0 1 6 0v1h-2V7a1 1 0 0 0-2 0v1z" fill="currentColor"/></symbol>
    <symbol id="i-friends" viewBox="0 0 24 24"><circle cx="8.5" cy="8" r="3.5" fill="currentColor"/><circle cx="16.5" cy="9" r="3" fill="currentColor" opacity=".75"/><path d="M2 20c0-4 3-6 6.5-6S15 16 15 20zm13.5 0c0-2-.6-3.8-1.8-5 3.6-.6 7.3 1 7.3 5z" fill="currentColor"/></symbol>
    <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M7 3h10v2h4v3a5 5 0 0 1-5 5 5 5 0 0 1-3 2.8V18h3v3H8v-3h3v-2.2A5 5 0 0 1 8 13a5 5 0 0 1-5-5V5h4zm0 4H5v1a3 3 0 0 0 2 2.8zm10 0v3.8A3 3 0 0 0 19 8V7z" fill="currentColor"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><path d="M10.3 2h3.4l.5 2.6 2 .9 2.2-1.5 2.4 2.4-1.5 2.2.9 2 2.6.5v3.4l-2.6.5-.9 2 1.5 2.2-2.4 2.4-2.2-1.5-2 .9-.5 2.6h-3.4l-.5-2.6-2-.9-2.2 1.5-2.4-2.4 1.5-2.2-.9-2L2 13.7v-3.4l2.6-.5.9-2L4 5.6 6.4 3.2l2.2 1.5 2-.9zM12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7z" fill="currentColor"/></symbol>
    <symbol id="i-cal" viewBox="0 0 24 24"><path d="M7 2h2v2h6V2h2v2h3v17H4V4h3zm-1 7v10h12V9zm2 2h2v2H8zm4 0h2v2h-2zm4 0h2v2h-2zm-8 4h2v2H8zm4 0h2v2h-2z" fill="currentColor"/></symbol>
    <symbol id="i-mail" viewBox="0 0 24 24"><path d="M2 5h20v14H2zm2 2v.5l8 5.5 8-5.5V7zm0 3v7h16v-7l-8 5.5z" fill="currentColor"/></symbol>
    <symbol id="i-full" viewBox="0 0 24 24"><path d="M3 3h7v2H5v5H3zm11 0h7v7h-2V5h-5zM3 14h2v5h5v2H3zm16 0h2v7h-7v-2h5z" fill="currentColor"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M3 5h18v2.5H3zm0 5.75h18v2.5H3zM3 16.5h18V19H3z" fill="currentColor"/></symbol>
    <symbol id="i-gem" viewBox="0 0 24 24"><path d="M12 0l3 9 9 3-9 3-3 9-3-9-9-3 9-3z" fill="url(#gGem)"/></symbol>
    <symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.5" fill="url(#gCoin)" stroke="#a8701a" stroke-width="1"/><path d="M12 6l1.6 4h4.2l-3.4 2.6 1.3 4.2L12 14.3l-3.7 2.5 1.3-4.2L6.2 10h4.2z" fill="#fff5c8" opacity=".9"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 21C5 15.5 2 12.3 2 8.5A5 5 0 0 1 12 6a5 5 0 0 1 10 2.5c0 3.8-3 7-10 12.5z" fill="url(#gHeart)"/></symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2 4 14h6l-1 8 9-12h-6z" fill="#c9a6ff"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7v5l3 2" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4v16l13-8z" fill="currentColor"/></symbol>
    <symbol id="i-sofa" viewBox="0 0 24 24"><path d="M4 9a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2a2 2 0 0 1 2 2v5h-2v2h-2v-2H6v2H4v-2H2v-5a2 2 0 0 1 2-2z" fill="currentColor"/></symbol>
    <symbol id="i-crown" viewBox="0 0 24 24"><path d="M3 18 2 7l5.5 4L12 4l4.5 7L22 7l-1 11z" fill="currentColor"/></symbol>
    <symbol id="i-controller" viewBox="0 0 24 24"><path d="M7 7h10a5 5 0 0 1 4.8 6.4l-1.1 3.8a2.3 2.3 0 0 1-3.9.9L14.5 16h-5l-2.3 2.1a2.3 2.3 0 0 1-3.9-.9l-1.1-3.8A5 5 0 0 1 7 7zm0 3v1.5H5.5v1.5H7v1.5h1.5V13H10v-1.5H8.5V10zm8.5.5a1 1 0 1 0 0 2 1 1 0 0 0 0-2zm2 2a1 1 0 1 0 0 2 1 1 0 0 0 0-2z" fill="currentColor"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M3 4h7a2 2 0 0 1 2 2 2 2 0 0 1 2-2h7v15h-7a2 2 0 0 0-2 2 2 2 0 0 0-2-2H3z" fill="currentColor"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 1 7 7c0 5-7 13-7 13S5 14 5 9a7 7 0 0 1 7-7zm0 4.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z" fill="currentColor"/></symbol>
  </defs>
</svg>

<!-- Backgrounds: animated castle video, plus still places -->
<div class="sky" aria-hidden="true">
  <video id="bgVideo" src="assets/castle.mp4" poster="assets/castle-poster.webp" autoplay muted loop playsinline></video>
  <div class="place" id="placeBg"></div>
  <div class="veil"></div>
  <canvas id="petals"></canvas>
</div>

<div class="app">
  <header class="topbar">
    <div class="profile">
      <div class="avatar" aria-hidden="true">
        <img class="af" src="assets/avatar-frame.webp" alt="">
        <img class="aface" id="avatarFace" src="assets/face-neutral.webp" alt="">
      </div>
      <div class="pinfo">
        <div class="plate name"><span id="pname">Asteria</span><svg class="ico star"><use href="#i-quest"/></svg></div>
        <div class="plate lvl">Lv. <span id="level">1</span></div>
        <div class="bar exp"><i id="expBar"></i><span id="expTxt">EXP 0%</span></div>
      </div>
    </div>
    <div class="currencies">
      <button class="pill" data-shop aria-label="Stars, buy more"><svg class="ico big"><use href="#i-gem"/></svg><b id="cStars">0</b><span class="plus">+</span></button>
      <button class="pill" data-shop aria-label="Coins, buy more"><svg class="ico big"><use href="#i-coin"/></svg><b id="cCoins">0</b><span class="plus">+</span></button>
      <button class="pill" data-shop aria-label="Hearts, buy more"><svg class="ico big"><use href="#i-heart"/></svg><b id="cHearts">0</b><span class="plus">+</span></button>
    </div>
    <div class="tools">
      <button class="tool" id="calBtn" aria-label="Login calendar"><svg class="ico"><use href="#i-cal"/></svg><i class="dot" id="calDot"></i></button>
      <button class="tool" id="mailBtn" aria-label="Mailbox"><svg class="ico"><use href="#i-mail"/></svg><i class="dot" id="mailDot"></i></button>
      <button class="tool" id="setBtn" aria-label="Settings"><svg class="ico"><use href="#i-gear"/></svg></button>
      <button class="tool" id="fullBtn" aria-label="Fullscreen"><svg class="ico"><use href="#i-full"/></svg></button>
      <button class="tool menu-btn" id="menuBtn" aria-label="Menu" aria-expanded="false"><svg class="ico"><use href="#i-menu"/></svg></button>
    </div>
  </header>

  <nav class="side" id="side" aria-label="Main">
    <img class="side-bow" src="assets/bow-a.webp" alt="">
    <button class="nav active" data-nav="home"><svg class="ico"><use href="#i-home"/></svg><span>Home</span></button>
    <button class="nav" data-nav="map"><svg class="ico"><use href="#i-map"/></svg><span>Map</span></button>
    <button class="nav" data-nav="quest"><svg class="ico"><use href="#i-quest"/></svg><span>Quest</span><i class="dot" id="questDot"></i></button>
    <button class="nav" data-nav="inventory"><svg class="ico"><use href="#i-bag"/></svg><span>Inventory</span></button>
    <button class="nav" data-nav="wardrobe"><svg class="ico"><use href="#i-hanger"/></svg><span>Wardrobe</span></button>
    <button class="nav" data-nav="shop"><svg class="ico"><use href="#i-shop"/></svg><span>Shop</span></button>
    <button class="nav" data-nav="friends"><svg class="ico"><use href="#i-friends"/></svg><span>Friends</span></button>
    <button class="nav" data-nav="album"><svg class="ico"><use href="#i-book"/></svg><span>Memories</span><i class="dot" id="albumDot"></i></button>
    <button class="nav" data-nav="achievements"><svg class="ico"><use href="#i-trophy"/></svg><span>Achievements</span><i class="dot" id="achDot"></i></button>
    <button class="nav" data-nav="settings"><svg class="ico"><use href="#i-gear"/></svg><span>Settings</span></button>
  </nav>

  <section class="col-left">
    <div class="panel">
      <h2><span><svg class="ico sm"><use href="#i-quest"/></svg> Main Quest</span><small class="muted" id="chapterName"></small></h2>
      <div class="row quest">
        <div class="qtext"><div class="qline"><svg class="ico xs"><use href="#i-quest"/></svg><span id="questName"></span></div><small id="questProg"></small></div>
        <button class="arrow" id="questGo" aria-label="Play quest">›</button>
      </div>
      <div class="bar violet thin"><i id="qBar"></i></div>
    </div>
    <div class="panel">
      <h2><span><svg class="ico sm"><use href="#i-heart"/></svg> Daily Tasks</span><small class="muted" id="resetIn"></small></h2>
      <ul class="tasks" id="tasks"></ul>
    </div>
  </section>

  <section class="stage" id="stage">
    <div class="loc-tag" id="locTag"><svg class="ico sm"><use href="#i-pin"/></svg><span id="locName">Moonlit Manor</span></div>
    <div class="notes" id="notes"></div>
    <div class="bubble" id="bubble">Another lovely day… ♡</div>
    <button class="doll" id="doll" aria-label="Talk to Asteria"></button>
    <div class="npc" id="npc" hidden></div>
    <div class="dialog" id="dialog" hidden>
      <img class="dlg-bow" src="assets/bow-a.webp" alt="">
      <div class="dlg-name" id="dlgName">Asteria</div>
      <p id="dlgText"></p>
      <div class="choices-col" id="dlgChoices"></div>
      <button class="dlg-next" id="dlgNext" aria-label="Next">▼</button>
    </div>
  </section>

  <section class="col-right">
    <button class="panel event" id="eventCard">
      <h2><span><svg class="ico sm"><use href="#i-quest"/></svg> Next Event</span><span class="go">›</span></h2>
      <div class="event-art"><img src="assets/event-ball.webp" alt=""><span>Royal Fashion Ball</span></div>
      <div class="timer"><svg class="ico sm"><use href="#i-clock"/></svg> <span id="countdown">--</span></div>
      <div class="theme">Today's theme: <b id="themeName"></b></div>
    </button>
    <div class="panel">
      <h2><span><svg class="ico sm"><use href="#i-quest"/></svg> Your Stats</span></h2>
      <div class="stat"><span><svg class="ico sm"><use href="#i-heart"/></svg> Health</span><b id="sHealth"></b></div>
      <div class="bar pink"><i id="bHealth"></i></div>
      <div class="stat"><span><svg class="ico sm"><use href="#i-bolt"/></svg> Energy</span><b id="sEnergy"></b></div>
      <div class="bar violet"><i id="bEnergy"></i></div>
      <div class="stat"><span><svg class="ico sm"><use href="#i-coin"/></svg> Money</span><b id="sMoney"></b></div>
      <div class="stat"><span><svg class="ico sm"><use href="#i-gem"/></svg> Stars</span><b id="sStars"></b></div>
    </div>
  </section>

  <section class="bottom">
    <div class="panel house" id="housePanel">
      <h2><span><svg class="ico sm"><use href="#i-home"/></svg> Your House</span></h2>
      <div class="house-body">
        <button class="house-art" id="houseArt" aria-label="Go to Asteria's room"><img src="assets/bg-bedroom.webp" alt=""></button>
        <div class="house-stats">
          <div class="hs"><svg class="ico"><use href="#i-sofa"/></svg><div>Comfort<b id="hComfort"></b></div></div>
          <div class="hs"><svg class="ico"><use href="#i-crown"/></svg><div>Decoration<b id="hDeco"></b></div></div>
          <button class="btn" id="upgrade">⬆ Upgrade <small id="upCost"></small></button>
        </div>
      </div>
    </div>
    <div class="panel games">
      <h2><span><svg class="ico sm"><use href="#i-controller"/></svg> Mini Games</span><small class="muted">10 energy each</small></h2>
      <div class="game-row">
        <button class="game g-dress" data-game="dress"><img src="assets/outfit-gothic.webp" alt=""><span>Dress Up</span></button>
        <button class="game g-puzzle" data-game="puzzle"><img src="assets/item-wishstar.webp" alt=""><span>Puzzle</span></button>
        <button class="game g-cook" data-game="cook"><svg viewBox="0 0 40 40"><path d="M9 20h22l-3 16H12z" fill="#6b3d52"/><path d="M8 20q0-10 12-10t12 10z" fill="#ffe0ef"/><circle cx="20" cy="8" r="4" fill="#d6336c"/><path d="M20 4q2-3 5-3" stroke="#5f8a6a" fill="none"/></svg><span>Cooking</span></button>
      </div>
    </div>
    <button class="panel collection" id="collection">
      <h2><span><svg class="ico sm"><use href="#i-book"/></svg> Collection</span><span class="go">›</span></h2>
      <div class="slots" id="slots"></div>
      <div class="count"><span id="collCount"></span> / 200</div>
    </button>
    <button class="continue" id="continue"><img class="cbow" src="assets/bigbow.webp" alt=""><svg class="ico play"><use href="#i-play"/></svg><span>Continue</span></button>
  </section>
</div>

<div class="modal" id="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <button class="close" id="mClose" aria-label="Close">×</button>
    <h3 id="mTitle"></h3>
    <div id="mBody"></div>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script src="js/data.js"></script>
<script src="js/audio.js"></script>
<script src="js/art.js"></script>
<script src="js/game.js"></script>

</body></html>
